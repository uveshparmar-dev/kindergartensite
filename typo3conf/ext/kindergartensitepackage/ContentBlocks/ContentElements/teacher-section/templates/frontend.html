<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<section id="teacher">
    <div class="container padding-medium pt-0">

        <!-- Section Heading -->
        <f:if condition="{data.header}">
            <h2 class="display-4 text-center mb-5">
                {data.header}
            </h2>
        </f:if>

        <div class="row">

            <!-- Loop Educator Items -->
            <f:for each="{data.educator_items}" as="item">

                <div class="col-md-6 col-lg-3 my-4 my-lg-0">
                    <div class="text-center">

                        <!-- IMAGE -->
                        <f:if condition="{item.image.0}">
                            <f:if condition="{item.link}">
                                <f:then>
                                    <f:link.typolink parameter="{item.link}">
                                        <f:image image="{item.image.0}"
                                                 class="img-fluid rounded-4"
                                                 alt="{item.header}"
                                                 width="310"
                                                 height="310" />
                                    </f:link.typolink>
                                </f:then>
                                <f:else>
                                    <f:image image="{item.image.0}"
                                             class="img-fluid rounded-4"
                                             alt="{item.header}"
                                             width="310"
                                             height="310" />
                                </f:else>
                            </f:if>
                        </f:if>

                        <!-- NAME -->
                        <f:if condition="{item.link}">
                            <f:then>
                                <f:link.typolink parameter="{item.link}" class="hover-color">
                                    <h2 class="mt-3">
                                        {item.header}
                                    </h2>
                                </f:link.typolink>
                            </f:then>
                            <f:else>
                                <h2 class="mt-3">
                                    {item.header}
                                </h2>
                            </f:else>
                        </f:if>

                        <!-- DESIGNATION -->
                        <f:if condition="{item.subheader}">
                            <p class="m-0">
                                {item.subheader}
                            </p>
                        </f:if>

                    </div>
                </div>

            </f:for>

        </div>
    </div>
</section>

</html>
