<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Preview" />

<!-- HEADER -->
<f:section name="Header">
    <div style="margin-bottom:15px;">
        <be:link.editRecord uid="{data.uid}" table="tt_content">
            <strong>Classes Section</strong>
        </be:link.editRecord>
        <hr style="margin-top:8px; border:0; border-top:1px solid #ccc;">
    </div>
</f:section>

<!-- CONTENT -->
<f:section name="Content">

    <div style="padding:10px;">
        

        <!-- Total Classes -->
        <p>
            <strong>Total Classes:</strong>
            {data.net2typo_classes_classes -> f:count()}
        </p>

        <!-- TABLE -->
        <table style="width:100%; border-collapse:collapse; margin-top:15px;">

            <thead>
                <tr style="text-align:left; border-bottom:1px solid #ccc;">
                    <th style="padding:8px;">Image</th>
                    <th style="padding:8px;">Title</th>
                    <th style="padding:8px;">Age Range</th>
                    <th style="padding:8px;">Class Size</th>
                    <th style="padding:8px;">Price</th>
                </tr>
            </thead>

            <tbody>

                <f:for each="{data.net2typo_classes_classes}" as="item">

                    <tr style="border-bottom:1px solid #eee;">

                        <!-- IMAGE -->
                        <td style="padding:10px;">
                            <be:link.editRecord uid="{data.uid}" table="tt_content">
                                <f:if condition="{item.image.0}">
                                    <f:image image="{item.image.0}" width="70" />
                                </f:if>
                            </be:link.editRecord>
                        </td>

                        <!-- TITLE -->
                        <td style="padding:10px;">
                            <be:link.editRecord uid="{data.uid}" table="tt_content">
                                <strong>{item.title}</strong>
                            </be:link.editRecord>
                        </td>

                        <!-- AGE -->
                        <td style="padding:10px;">
                            <be:link.editRecord uid="{data.uid}" table="tt_content">
                                {item.age}
                            </be:link.editRecord>
                        </td>

                        <!-- SIZE -->
                        <td style="padding:10px;">
                            <be:link.editRecord uid="{data.uid}" table="tt_content">
                                {item.class_size}
                            </be:link.editRecord>
                        </td>

                        <!-- PRICE -->
                        <td style="padding:10px;">
                            <be:link.editRecord uid="{data.uid}" table="tt_content">
                                {item.price}
                            </be:link.editRecord>
                        </td>

                    </tr>

                </f:for>

            </tbody>

        </table>

    </div>

</f:section>

</html>
