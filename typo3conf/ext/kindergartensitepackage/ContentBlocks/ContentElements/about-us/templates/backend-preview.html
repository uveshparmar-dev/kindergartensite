<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers" data-namespace-typo3-fluid="true">

<f:layout name="Preview" />

<!-- HEADER -->
<f:section name="Header">
    <be:link.editRecord uid="{data.uid}" table="tt_content">
        <strong>About Us Section</strong>
    </be:link.editRecord>
</f:section>


<!-- CONTENT -->
<f:section name="Content">

    <div style="padding:15px;">

        <h4 style="margin-bottom:10px;">About Us Section</h4>
        <hr>

        <!-- IMAGE -->
        <strong>Main Image(s):</strong>
        <f:if condition="{data.net2typo_aboutus_background_image}">
            <be:link.editRecord uid="{data.uid}" table="tt_content">
                <div style="margin:10px 0;">
                    <f:for each="{data.net2typo_aboutus_background_image}" as="file">
                        <f:image image="{file}" maxWidth="120" maxHeight="120"
                            style="border:1px solid #ccc; padding:5px;" />
                    </f:for>
            </be:link.editRecord>
    </div>
    </f:if>

    <!-- HEADING (Clickable) -->
    <p>
        <strong>Heading:</strong>
        <be:link.editRecord uid="{data.uid}" table="tt_content">
            {data.header}
        </be:link.editRecord>
    </p>

    <!-- DESCRIPTION (Clickable) -->
    <p>
        <strong>Description:</strong><br>
        <be:link.editRecord uid="{data.uid}" table="tt_content">
            <f:format.crop maxCharacters="250">
                <f:format.stripTags>
                    {data.bodytext}
                </f:format.stripTags>
            </f:format.crop>
        </be:link.editRecord>
    </p>

    <!-- BUTTON TEXT (Clickable) -->
    <p>
        <strong>Button:</strong>
        <be:link.editRecord uid="{data.uid}" table="tt_content">
            {data.subheader}
        </be:link.editRecord>
    </p>

    </div>

</f:section>

</html>
