<section id="teacher">
    <div class="container padding-medium pt-0">

        <!-- Heading -->
        <f:if condition="{data.tx_mask_heading}">
            <h2 class="display-4 text-center mb-5">
                {data.tx_mask_heading}
            </h2>
        </f:if>

        <div class="row">

            <!-- Loop teacher items -->
            <f:for each="{data.tx_mask_educators}" as="data_item">
                <div class="col-md-6 col-lg-3 my-4 my-lg-0">
                    <div class="text-center">

                     
                        <a href="{f:if(condition: data_item.tx_mask_link, then: data_item.tx_mask_link, else:'#')}">
                            <f:for each="{data_item.tx_mask_educator_image}" as="file">
                                <f:media 
                                    file="{file}" 
                                    class="img-fluid rounded-4"
                                    alt="{data_item.tx_mask_name}"
                                />
                            </f:for>
                        </a>

                       
                        <a href="{f:if(condition: data_item.tx_mask_link, then: data_item.tx_mask_link, else:'#')}" class="hover-color">
                            <h2 class="mt-3 ">
                                {data_item.tx_mask_name}
                            </h2>
                        </a>

                        <!-- JOB TITLE -->
                        <f:if condition="{data_item.tx_mask_job_}">
                            <p class="m-0">
                                {data_item.tx_mask_job_}
                            </p>
                        </f:if>

                    </div>
                </div>
            </f:for>

        </div>
    </div>
</section>
