<f:if condition="{data}">

    <div class="mask-backend-preview">

        <strong>Hero Slider</strong>
        <hr>

        <!-- TOTAL SLIDES -->
        <f:if condition="{data.tx_mask_slider}">
            <strong>Total Slides:</strong>
            {data.tx_mask_slider -> f:count()}
            <br><br>
        </f:if>

        <!-- SLIDE TEXT -->
        <f:if condition="{data.tx_mask_slide_text}">
            <strong>Hero Text:</strong>
            <f:format.stripTags>
                {data.tx_mask_slide_text}
            </f:format.stripTags>
            <br><br>
        </f:if>

        <!-- BUTTON LINK -->
        <f:if condition="{data.tx_mask_link}">
            <strong>Button Link:</strong>
            {data.tx_mask_link}
            <br><br>
        </f:if>

        <!-- TABLE HEADER -->
        <div style="
            display:flex;
            font-weight:bold;
            border-bottom:2px solid #ccc;
            padding-bottom:6px;
            margin-bottom:10px;
        ">
            <div style="width:140px;">Image</div>
            <div style="flex:1;">Slide</div>
        </div>

        <!-- SLIDES PREVIEW -->
        <f:for each="{data.tx_mask_slider}" as="slide" iteration="i">

            <div style="
                display:flex;
                align-items:center;
                border-bottom:1px solid #eee;
                padding:8px 0;
            ">

                <!-- SLIDE IMAGE -->
                <div style="width:140px;">
                    <f:if condition="{slide.tx_mask_swiper_image}">
                        <f:for each="{slide.tx_mask_swiper_image}" as="file" iteration="img">
                            <f:if condition="{img.isFirst}">
                                <f:media
                                    file="{file}"
                                    width="120"
                                    height="70"
                                    alt="{file.alternative}"
                                />
                            </f:if>
                        </f:for>
                    </f:if>
                </div>

                <!-- SLIDE LABEL -->
                <div style="flex:1;">
                    Slide {i.cycle}
                </div>

            </div>

        </f:for>

    </div>

</f:if>

<f:if condition="{data} == 0">
    <em>No hero slides added yet.</em>
</f:if>
