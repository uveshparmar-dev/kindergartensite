<f:if condition="{data}">

    <div class="mask-backend-preview">

        <strong>CTA Section</strong>
        <hr>

        <!-- BACKGROUND IMAGE PREVIEW -->
        <f:if condition="{data.tx_mask_bg}">
            <strong>Background Image(s):</strong>
            {data.tx_mask_bg -> f:count()}
            <br><br>

            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <f:for each="{data.tx_mask_bg}" as="bg">
                    <div style="
                        width:140px;
                        height:80px;
                        border:1px solid #ddd;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#fafafa;
                    ">
                        <f:media
                            file="{bg}"
                            width="140"
                            height="80"
                            alt="{bg.alternative}"
                        />
                    </div>
                </f:for>
            </div>
        </f:if>

        <!-- HEADING -->
        <f:if condition="{data.tx_mask_headingtext}">
            <strong>Heading:</strong>
            <f:format.stripTags>
                {data.tx_mask_headingtext}
            </f:format.stripTags>
            <br><br>
        </f:if>

        <!-- DESCRIPTION -->
        <f:if condition="{data.tx_mask_description}">
            <strong>Description:</strong>
            <div style="max-width:700px;">
                <f:format.stripTags>
                    {data.tx_mask_description}
                </f:format.stripTags>
            </div>
            <br>
        </f:if>

        <!-- BUTTON LINK -->
        <f:if condition="{data.tx_mask_buttonlink}">
            <strong>Button Link:</strong>
            {data.tx_mask_buttonlink}
            <br>
        </f:if>

    </div>

</f:if>

<f:if condition="{data} == 0">
    <em>No CTA content added yet.</em>
</f:if>
