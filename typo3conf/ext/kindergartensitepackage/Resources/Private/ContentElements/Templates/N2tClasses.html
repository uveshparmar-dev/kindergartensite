<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<section id="classes">
    <div class="padding-medium">

        <!-- MAIN HEADING (tt_content header field) -->
        <div class="card-body">
            <f:if condition="{data.header}">
                <h2 class="display-4 text-center mb-5">
                    {data.header}
                </h2>
            </f:if>
        </div>

        <!-- SWIPER -->
        <div class="swiper classes-swiper">
            <div class="swiper-wrapper">

                <!-- LOOP CHILD TABLE RECORDS -->
                <f:for each="{items}" as="item">

                    <div class="swiper-slide">
                        <div class="card bg-transparent border-0">

                            <!-- IMAGE -->
                            <div class="zoom-effect rounded-4">
                                <f:if condition="{item.images}">
                                    <f:for each="{item.images}" as="image">
                                        <img src="{image.publicUrl}" class="img-fluid" alt="{item.data.title}" />
                                    </f:for>
                                </f:if>
                            </div>

                            <div class="card-body p-0">

                                <!-- CLASS TITLE -->
                                <h2 class="mt-3">
                                    {item.data.title}
                                </h2>

                                <div class="card-text">
                                    <div class="d-flex">

                                        <!-- AGE -->
                                        <div class="pe-4 border-end border-2">
                                            <p class="text-primary fw-medium fs-4 m-0">
                                                {item.data.age}
                                            </p>
                                            <p class="m-0 text">
                                               Years Old
                                            </p>
                                        </div>

                                        <!-- CLASS SIZE -->
                                        <div class="ps-4 pe-4 border-end border-2">
                                            <p class="text-primary fw-medium fs-4 m-0">
                                                {item.data.classnumber}
                                            </p>
                                            <p class="m-0 text">
                                                Class-Size
                                            </p>
                                        </div>

                                        <!-- PRICING -->
                                        <div class="ps-4 pe-4">
                                            <p class="text-primary fw-medium fs-4 m-0">
                                                {item.data.amount}
                                            </p>
                                            <p class="m-0 text">
                                                Pricing
                                            </p>
                                        </div>

                                    </div>
                                </div>

                            </div>

                        </div>
                    </div>

                </f:for>

            </div>

            <!-- PAGINATION DOTS -->
            <div class="swiper-pagination pt-5 mt-3"></div>

        </div>

    </div>
</section>

</html>
