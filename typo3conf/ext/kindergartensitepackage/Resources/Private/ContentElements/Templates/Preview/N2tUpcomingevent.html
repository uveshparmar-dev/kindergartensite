<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers" data-namespace-typo3-fluid="true">

<f:if condition="{record.tx_kindergartensitepackage_n2tupcomingevent_item}">

    <div style="padding:15px;">

        <!-- Total Count -->
        <p>
            <strong>Total Events:</strong>
            {record.tx_kindergartensitepackage_n2tupcomingevent_item -> f:count()}
        </p>

        <!-- Table -->
        <table style="width:100%; border-collapse:collapse; margin-top:15px;">

            <thead>
                <tr style="border-bottom:1px solid #ccc;">
                    <th align="left">Icon</th>
                    <th align="left">Date</th>
                    <th align="left">Title</th>
                    <th align="left">Time</th>
                    <th align="left" style="padding-left:30px;">Link</th>
                </tr>
            </thead>

            <tbody>
                <f:for each="{record.tx_kindergartensitepackage_n2tupcomingevent_item}" as="item">

                    <tr style="border-bottom:1px solid #e5e5e5;">

                        <!-- Icon -->
                        <td style="padding:10px 0; width:80px;">
                            <be:link.editRecord table="tx_kindergartensitepackage_n2tupcomingevent_item"
                                uid="{item.uid}">

                                <f:if condition="{item.icon_file}">
                                    <f:for each="{item.icon_file}" as="file" iteration="iterator">
                                        <f:if condition="{iterator.isFirst}">
                                            <f:image image="{file}" width="50c" height="50c" />
                                        </f:if>
                                    </f:for>
                                </f:if>

                            </be:link.editRecord>
                        </td>

                        <!-- Date -->
                        <td>
                            <be:link.editRecord table="tx_kindergartensitepackage_n2tupcomingevent_item"
                                uid="{item.uid}">
                                <strong>{item.day}</strong> {item.month}
                            </be:link.editRecord>
                        </td>

                        <!-- Title -->
                        <td>
                            <be:link.editRecord table="tx_kindergartensitepackage_n2tupcomingevent_item"
                                uid="{item.uid}">
                                <strong>{item.title}</strong>
                            </be:link.editRecord>
                        </td>

                        <!-- Time -->
                        <td>
                            <be:link.editRecord table="tx_kindergartensitepackage_n2tupcomingevent_item"
                                uid="{item.uid}">
                                {item.time}
                            </be:link.editRecord>
                        </td>

                        <td style="padding-left:30px; max-width:350px;">
                            <f:if condition="{item.link}">
                                <be:link.editRecord table="tx_kindergartensitepackage_n2tupcomingevent_item"
                                    uid="{item.uid}">

                                    <div style="
                                      max-width:350px;
                                     overflow:hidden;
                                     text-overflow:ellipsis;
                                     white-space:nowrap;
                                      
                                      ">
                                        <f:uri.typolink parameter="{item.link}" absolute="1" />
                                    </div>

                                </be:link.editRecord>
                            </f:if>
                        </td>

                    </tr>

                </f:for>
            </tbody>

        </table>

    </div>

</f:if>

<f:if condition="{record.tx_kindergartensitepackage_n2tupcomingevent_item -> f:count()} == 0">
    <em style="color:#999;">No Upcoming Events added yet.</em>
</f:if>

</html>
