<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<section id="gallery">
    <div class="padding-medium pt-0">

        <!-- Header -->
        <f:if condition="{data.header}">
            <h2 class="display-4 text-center mb-5">
                {data.header}
            </h2>
        </f:if>
        <!-- Masonry Container -->
        <div class="row entry-container" id="masonry-gallery">

            <f:for each="{items}" as="item">
                <f:if condition="{item.images.0}">
                    <div class="entry-item col-md-4 my-3 gallery-item">

                        <a href="{item.images.0.publicUrl}" class="image-link" title="{item.images.0.description}">

                            <img src="{item.images.0.publicUrl}" class="post-image img-fluid rounded-4"
                                alt="{item.images.0.alternative}">
                        </a>

                    </div>
                </f:if>
            </f:for>

        </div>




        <f:if condition="{data.button_link}">
            <div class="text-center">
                <f:link.typolink parameter="{data.button_link}" class="btn btn-primary mt-4">
                    {data.buttontext -> f:if(condition: data.buttontext, else: 'View Gallery')}
                </f:link.typolink>
            </div>
        </f:if>


    </div>
</section>

</html>
